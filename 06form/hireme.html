        <!-- GOOGLE FONT -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
    <header>
       <span>Beginners Guide to Photography</span>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Exposure Fundamentals</a></li>
            <li><a href="exposure.html">Exposure Modes</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li class="active"><a href="hireme.html">Hire Me</a></li>
        </ul>
    </nav>
    <main>
        <h1>Hire Me</h1>
        <form method="GET" class="hireform" action="thanks.html">
            
            <fieldset>
            <legend>Customer Information</legend>
                <label>First Name* <input type="text" name="fname" required></label>      
                <label>Last Name* <input type="text" name="lname" required></label>
                <label>Email* <input type="email" name="email" required></label> 
                <label>Cell Number* <input type="tel" name="phone" placeholder="987-555-1234" required></label>
            </fieldset>
            
            <fieldset>
            <legend>Type of Service</legend>
                <label><input type="radio" name="service" value="portrait"> Portrait</label>  
                <label><input type="radio" name="service" value="wedding"> Wedding</label>
                <label><input type="radio" name="service" value="event"> Event</label>
            </fieldset>
            
            <fieldset>
                <legend>When are you available?</legend>
                <label><input type="checkbox" name="am" value="chosen"> Before Lunch </label>  
                <label><input type="checkbox" name="afternoon" value="chosen"> After Lunch </label>
                <label><input type="checkbox" name="pm" value="chosen"> Evening </label>
                <label><input type="checkbox" name="weekend" value="chosen"> Weekend </label>
            </fieldset>
            
            <fieldset>
                <legend>How would you like your photos?</legend>
                <label>Deliverables
                <select name="day">
                    <option value="none">Please Select</option>
                    <option value="digital">Digital Files</option>
                    <option value="physical">Physical Prints</option>
                    <option value="flickr">Flickr Account</option>
                    </select>
                </label>
            </fieldset>
            
                
                <label>Project Description
                <textarea name="comment"></textarea>
                </label>
            
            <input type="submit" value="Send Delivery Request">
                
            </form>


    </main>
    <footer>&copy; Paul Cheney &bull; Web Essentials Practice Assignment</footer>
</body>
</html>
